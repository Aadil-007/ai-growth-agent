name: Daily collect
on:
  schedule:
    - cron: "0 4 * * *"   # 08:00 Dubai time (UTC+4)
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: PYTHONPATH=src python -m ai_growth_agent.main
